<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duel panel browser tests</title><link rel="stylesheet" href="/src/ui/style.css"><style>body{padding:20px;overflow:auto}#results{white-space:pre-wrap}#field{display:flex;gap:12px}.test-card{width:90px;height:100px;border:1px solid #789}</style></head><body>
<h2>Duel panel browser tests</h2><button id="run">Run checks</button><button id="preview">Preview Vent 6</button><button id="action">Unrelated game action</button><button id="read">Inspect board card</button><div id="field"></div><pre id="results">Ready</pre>
<script type="module">
import {openCardChoice,ventSelectionSummary} from '/src/ui/card-choice.ts';
import {mountDuelPanel,registerPanelInspection,duelDecisionPending} from '/src/ui/duel-panel.ts';
import {ALL_CARDS} from '/src/data/loader.ts';
import {artUrl} from '/src/ui/assets.ts';
const record=Object.values(ALL_CARDS).find(c=>c.name.includes('Bakunawa')&&c.set==='set-1');
const cards=Array.from({length:12},(_,i)=>({uid:`test-${i}`,name:i===0?'A very long card name that must never stretch this tile':`${record.name} ${i+1}`,image:artUrl(record.thumb),type:'Unit',zone:'heart',detail:'Test skill',stats:'Unit · Heart',weight:1}));
let actions=0,inspections=0;
document.querySelector('#action').onclick=()=>actions++;
registerPanelInspection(document.querySelector('#read'),()=>inspections++);
const q=s=>document.querySelector(s), click=s=>q(s).click(), frame=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const open=(opts={})=>openCardChoice({title:'Vent 6',instruction:'Choose six cards, then confirm once.',cards,max:6,exact:true,decline:'Cancel Vent',confirm:'Vent selected cards',...opts});
document.querySelector('#preview').onclick=async()=>{const selected=await open();q('#results').textContent='Chosen: '+selected.join(', ');};
const codexTitle='Your Persona is under attack — switch Codex? Pick one, or cancel to keep your current Codex.';
const codexOptions={title:codexTitle,instruction:'Choose a card, then confirm.',cards:cards.slice(0,1).map(c=>({...c,zone:'codex'})),max:1,exact:false,decline:'Keep current Codex'};
const codexPreview=document.createElement('button');codexPreview.textContent='Preview long Codex prompt';codexPreview.onclick=()=>open(codexOptions);q('#preview').after(codexPreview);
const riverOptions={title:'Unseen Passage: choose cards to Vent',instruction:'Choose any number of Heart cards. Draw 1 card for every 5 you Vent, after their skills resolve.',max:cards.length,exact:false,decline:'Skip',summary:ids=>ventSelectionSummary(ids,5)};
const riverPreview=document.createElement('button');riverPreview.textContent='Preview Unseen Passage';riverPreview.onclick=()=>open(riverOptions);codexPreview.after(riverPreview);
document.querySelector('#run').onclick=async()=>{
actions=0;inspections=0;
q('#results').textContent='Running checks…';
const results=[]; const check=(name,condition)=>{if(!condition)throw Error(name);results.push('PASS '+name);};
try{
 const river=open(riverOptions);await frame();
 check('Unseen Passage shows every Heart card',document.querySelectorAll('.cc-card').length===cards.length);
 for(let i=0;i<7;i++)click(`[data-choice="test-${i}"]`);
 check('Variable Vent previews draw at seven',q('.cc-summary').textContent.includes('7 selected to Vent · Draw 1')&&!q('.cc-actions .primary').disabled);
 click('[data-choice="test-6"]');click('[data-choice="test-5"]');click('[data-choice="test-4"]');
 check('Deselecting updates the draw preview',q('.cc-summary').textContent.includes('4 selected to Vent · Draw 0'));
 click('.cc-actions .primary');check('One confirmation submits the chosen amount',(await river).length===4);
 let codex=open(codexOptions);await frame();
 const title=q('.cc-head h3'),controls=q('.duel-controls');
 check('Full Codex instruction has no inner scrollbar',title.scrollHeight<=title.clientHeight+1&&getComputedStyle(title).overflowY==='visible');
 check('Controls do not squeeze the instruction',controls.getBoundingClientRect().top>=title.getBoundingClientRect().bottom);
 check('Codex confirmation remains inside the panel',q('.cc-actions').getBoundingClientRect().bottom<=q('.cc-dialog').getBoundingClientRect().bottom);
 check('Card artwork remains visible',q('.cc-grid').clientHeight>=60);
 const fits=()=>q('.cc-grid').scrollHeight<=q('.cc-grid').clientHeight+1&&[...document.querySelectorAll('.cc-card')].every(c=>c.getBoundingClientRect().bottom<=q('.cc-grid').getBoundingClientRect().bottom);
 check('Single card fits without vertical scrolling',fits());
 check('No carousel arrows for a single card',getComputedStyle(q('.cc-scroll-next')).visibility==='hidden');
 click('.cc-actions button:not(.primary)');await codex;
 let payment=open(); await frame();
 check('Compact default',!q('.duel-expanded'));
 check('No background blur',getComputedStyle(q('.duel-panel')).backdropFilter==='none');
 check('Many cards stay in one horizontal row',fits()&&q('.cc-grid').scrollWidth>q('.cc-grid').clientWidth);
 click('.cc-scroll-next');await frame();check('Next arrow moves the row sideways',q('.cc-grid').scrollLeft>0);
 const wheelStart=q('.cc-grid').scrollLeft;
 const wheel=new WheelEvent('wheel',{deltaY:-120,bubbles:true,cancelable:true});q('.cc-grid').dispatchEvent(wheel);await frame();
 check('Mouse wheel scrolls sideways instead of down',wheel.defaultPrevented&&q('.cc-grid').scrollLeft<wheelStart&&q('.cc-grid').scrollTop===0);
 for(let i=0;i<5;i++)click(`[data-choice="test-${i}"]`);
 check('Exact-count confirmation disabled at five',q('.cc-actions .primary').disabled);
 click('[data-choice="test-5"]'); click('[data-choice="test-6"]');
 check('Six-card cap',q('.cc-selected-count').textContent==='6 / 6 selected');
 click('[data-choice="test-0"]');check('Click again deselects',q('.cc-actions .primary').disabled);click('[data-choice="test-0"]');
 const before=document.activeElement;
 click('.duel-controls button:last-child');await frame();
 check('Minimize preserves count',q('.duel-restore').textContent.includes('6 / 6 selected'));
 check('Minimize removes panel and blur',getComputedStyle(q('.duel-dialog')).display==='none'&&getComputedStyle(q('.duel-panel')).backdropFilter==='none');
 click('#action');check('Background game command blocked',actions===0);
 click('#read');check('Board inspection permitted',inspections===1);
 document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));await frame();
 check('Escape restores without resolving',!q('.duel-minimized')&&duelDecisionPending());
 click('.duel-controls button:first-child');await frame();
 check('Expanded cards also fit without vertical scrolling',fits());
 click('.cc-selected-filter');check('Selected filter keeps only chosen copies',document.querySelectorAll('[data-choice]').length===6);
 check('Expand preserves count',q('.cc-selected-count').textContent==='6 / 6 selected');
 const nested=open({title:'Heart browser',browse:true,max:undefined,exact:false});await frame();
 check('Child browser suspends parent',document.querySelectorAll('.duel-suspended').length===1);
 document.querySelector('.duel-panel:not(.duel-suspended) .cc-actions button').click();await nested;
 check('Closing child restores parent',!q('.duel-suspended')&&q('.cc-selected-count').textContent==='6 / 6 selected');
 click('.cc-actions .primary');const paid=await payment;
 check('One confirmation returns all six in click order',paid.join(',')==='test-1,test-2,test-3,test-4,test-5,test-0');
 check('Completed choice cleans up',!duelDecisionPending()&&!document.body.classList.contains('duel-pending'));
 payment=open({max:2,cards:[{...cards[0],weight:2},cards[1]]});click('[data-choice="test-0"]');click('.cc-actions .primary');check('Weighted Offer preserved',(await payment).length===1);
 payment=open({max:2,ordered:true});click('[data-choice="test-0"]');click('[data-choice="test-1"]');
 await frame();check('Ordered cards and ordering controls fit vertically',fits());
 document.querySelectorAll('.cc-order button')[2].click();click('.cc-actions .primary');check('Ordered choices can be rearranged',(await payment).join(',')==='test-1,test-0');
 payment=open({max:3,cards:[{...cards[0],sentry:true},{...cards[1],sentry:true},cards[2]]});click('[data-choice="test-0"]');click('[data-choice="test-1"]');click('[data-choice="test-2"]');
 check('Only one Sentry selected',q('.cc-selected-count').textContent==='2 / 3 selected');click('.cc-actions button:not(.primary)');check('Cancellation resolves no cards',(await payment).length===0);
 q('#field').innerHTML='<button class="card test-card" data-uid="test-0">Legal field target</button>';
 payment=open({max:1,boardTargets:true,cards:[{...cards[0],zone:'ally'}]});click('#field button');
 check('Board target selects without playing',q('.cc-selected-count').textContent==='1 / 1 selected'&&q('#field button').classList.contains('decision-selected'));
 click('.cc-actions .primary');await payment;check('Field highlights cleaned up',!q('.decision-target'));
 const root=document.createElement('div');root.className='modal-bg';const dialog=document.createElement('div');dialog.className='modal';const header=document.createElement('header');dialog.append(header);root.append(dialog);mountDuelPanel(root,dialog,header,'Legacy prompt');
 root.remove();await frame();check('Generic shell cleans up on remove',!duelDecisionPending());
 let skillViews=0,reads=0;
 const heart=openCardChoice({title:'Heart',instruction:'Select a card to read its skills.',cards,browse:true,inspect:()=>reads++,
  browseAction:{label:'View skills',available:uid=>uid==='test-0',run:()=>skillViews++}});
 await frame();
 check('Heart browsing uses one horizontal row',fits()&&q('.cc-grid').scrollWidth>q('.cc-grid').clientWidth);
 check('Only usable Heart cards offer a skill button',document.querySelectorAll('.cc-browse-action').length===1);
 click('[data-choice="test-0"]');check('Tapping a Heart card inspects without using a skill',reads===1&&skillViews===0&&duelDecisionPending());
 const skillButton=q('.cc-browse-action');skillButton.click();skillButton.click();await heart;
 check('Explicit skill button closes the browser and opens skills once',skillViews===1&&!duelDecisionPending());
 q('#results').textContent=results.join('\n')+`\n${results.length} browser checks passed.`;
}catch(error){q('#results').textContent=results.join('\n')+'\nFAIL '+error.message;document.querySelectorAll('.duel-panel').forEach(n=>n.remove());throw error;}
};
</script></body></html>
