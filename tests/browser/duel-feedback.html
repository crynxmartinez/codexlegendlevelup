<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Duel feedback checks</title><link rel="stylesheet" href="/src/ui/style.css"><style>body{padding:12px}#previews{display:flex;flex-wrap:wrap;gap:8px}</style></head><body>
<h2>Duel feedback checks</h2><div id="previews"></div><p id="result">Choose a preview.</p>
<script type="module">
import { mountDuelPanel } from '/src/ui/duel-panel.ts';
import { skillConfirmation } from '/src/ui/skill-confirmation.ts';
import { shatterCard } from '/src/ui/card-shatter.ts';
import { ALL_CARDS } from '/src/data/loader.ts';
import { boardUrl } from '/src/ui/assets.ts';
const rec=Object.values(ALL_CARDS).find(c=>c.name.includes('Mangaw')&&c.set==='set-1');
const make=(tag,cls,text='')=>{const n=document.createElement(tag);n.className=cls;n.textContent=text;return n;};
function preview(kind){
 const root=make('div','modal-bg'),dialog=make('div','modal'),head=make('div','modal-head');
 let body, sub='',title=kind,confirm='Continue';
 if(kind==='Skill cost'){
  const model=skillConfirmation('Pay 1 Energy to create 2 Kaluluwa in your Heart?',3);
  body=model.body;title=model.title;confirm=model.accept;
 }else if(kind.includes('check')){
  body=make('div','check-reveal');const img=make('img','');img.src=boardUrl(rec.art);img.alt=rec.name;body.append(img);
  sub=`${rec.name} was revealed${kind==='Barrier check'?' from your broken Barrier':''} and goes to your hand.`;
 }else{
  body=make('div','outcome');body.append(make('p','outcome-explanation',kind==='Defense broken'?'Attack Power met or exceeded defense. The hit connected.':'Defense exceeded Attack Power. The hit was stopped.'));
  const stage=make('div',`shatter-stage ${kind==='Defense broken'?'broke':'held'}`),card=make('div','shatter-card');card.style.backgroundImage=`url("${boardUrl(rec.art)}")`;stage.append(card);body.append(stage,make('div','outcome-name',rec.name));
  sub=`Wind-Heart Rescuer, Taguwasi 31,000 vs ${rec.name} 11,000`;
 }
 head.append(make('h3','',title));dialog.append(head);if(sub)dialog.append(make('div','sub',sub));body.classList.add('duel-body');dialog.append(body);
 const row=make('div','row'),ok=make('button','primary',confirm);if(kind==='Skill cost'){const skip=make('button','','Skip');skip.onclick=()=>{root.remove();document.querySelector('#result').textContent='Skipped without payment';};row.append(skip);}
 row.append(ok);dialog.append(row);root.append(dialog);
 const shell=mountDuelPanel(root,dialog,head,title,{expand:kind!=='Skill cost'});shell.min.focus();
 const stop=kind==='Defense broken'?shatterCard(body.querySelector('.shatter-stage'),body.querySelector('.shatter-card'),boardUrl(rec.art)):undefined;
 const remove=root.remove.bind(root);root.remove=()=>{stop?.();remove();};ok.onclick=()=>{root.remove();document.querySelector('#result').textContent=`${kind} acknowledged`;};
}
for(const kind of ['Skill cost','Attack check','Barrier check','Defended','Defense broken']){const b=make('button','',kind);b.onclick=()=>preview(kind);document.querySelector('#previews').append(b);}
</script></body></html>
